plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = project.name
}

// jar is named per Minecraft version, e.g. lowball-helper-1.1.1+mc26.3.jar
version = "${project.version}+mc${project.minecraft_version}"

loom {
	splitEnvironmentSourceSets()

	mods {
		"lowballhelper" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "lowballhelper-gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
	// ./gradlew test -Dlowball.live=true also runs the tests that hit the real Hypixel/Coflnet APIs
	systemProperty "lowball.live", System.getProperty("lowball.live", "false")
	testLogging {
		showStandardStreams = System.getProperty("lowball.live") == "true"
	}
}

processResources {
	def version = project.version
	def range = project.minecraft_range
	inputs.property "version", version
	inputs.property "minecraft_range", range

	filesMatching("fabric.mod.json") {
		expand "version": version, "minecraft_range": range
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}
